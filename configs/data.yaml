# ---------------------------------------------------------------------------
# Tham số cho bước khảo sát dữ liệu (Phase 1) và chuyển mask -> COCO (Phase 2).
#
# Mọi tham số nằm ở đây, KHÔNG hard-code trong code (quy tắc 6 của plan).
# Giá trị nào chưa chắc thì để mặc định và ghi rõ "Phase 1 sẽ chốt lại".
# ---------------------------------------------------------------------------

paths:
  # Zip gốc trên Google Drive. Script đọc TRỰC TIẾP từ trong zip, không giải nén
  # — lý do ở docs/NOTES.md muc 1.7.
  zip: /content/drive/MyDrive/Flood_House_AI/floodnet_raw.zip

  # Nơi ghi kết quả cuối (báo cáo + ảnh overlay) để người dùng mở xem được.
  # Để trên Drive vì /content mất sạch khi runtime reset (NOTES muc 1.6).
  output_dir: /content/drive/MyDrive/Flood_House_AI/runs/eda

  # Thư mục tạm trên /content cho dữ liệu trung gian (file .jsonl ghi dở).
  # Cố ý KHÔNG để trên Drive: ghi Drive qua FUSE rất chậm, mà file này chỉ là
  # phương tiện trung gian, mất cũng không sao.
  work_dir: /content/floodnet_work

# ---------------------------------------------------------------------------
# Tiền xử lý — Phase 2 sẽ dùng đúng các giá trị này
# ---------------------------------------------------------------------------
preprocess:
  # Cạnh dài sau khi resize. 1536 là mặc định đã chốt trong plan muc 3, và GATE 1
  # (30/09/2026) giữ nguyên sau khi đo: trung vị cạnh nhỏ nhất của nhà là 148-166px,
  # gấp ~5 lần ngưỡng 32px, nên hạ hay nâng độ phân giải đều không đáng so với giá
  # phải trả bằng VRAM trên T4. Lưu ý dữ liệu có HAI cỡ ảnh gốc nên tỉ lệ resize
  # không đồng nhất (0,3840 và 0,3345 — NOTES §2.4).
  target_long_side: 1536

  # Diện tích nhỏ nhất (pixel, tính SAU resize) để coi là nhà thật, lọc nhiễu.
  # Đặt bằng min_side_px^2 = 8^2 để hai ngưỡng không mâu thuẫn nhau: một mảng
  # 1x500px lọt qua ngưỡng diện tích nhưng vẫn là vệt rác. Nhất quán cả hai thì
  # "nhà hợp lệ" chỉ có một định nghĩa duy nhất trong toàn bộ pipeline.
  min_area: 64

  # Hai lớp nhà của đồ án. Giá trị mask lấy theo bảng lớp FloodNet đã kiểm chứng
  # ở NOTES muc 2.1, nhưng script vẫn xác minh lại trên dữ liệu thật.
  classes:
    1: flooded_building
    2: non_flooded_building

  # Giá trị mask của lớp "Water" (nước) — dùng để kiểm chứng lớp 1 đúng là
  # "nhà ngập" (nhà ngập phải nằm cạnh nước nhiều hơn nhà không ngập).
  water_value: 5

# ---------------------------------------------------------------------------
# Ngưỡng quyết định — plan muc 5, Phase 1. Đọc số liệu ra rồi so với các mốc này.
# ---------------------------------------------------------------------------
decisions:
  # Cạnh nhỏ nhất (px) để một component được coi là box thật. Component nhỏ hơn
  # bị loại TRƯỚC KHI tính mọi thống kê và mọi quyết định bên dưới.
  #
  # Vì sao cần: lần chạy thử 30/09/2026 cho percentile 5 cạnh box = 1.0px trong
  # khi trung vị = 118px. Con số 1.0px đó là đốm nhiễu vài pixel trong mask, không
  # phải nhà — nhưng nó đủ sức kéo percentile 5 xuống và làm script kết luận "phải
  # cắt tile". Nhiễu gán nhãn đang quyết định thay nhà thật.
  #
  # Chọn 8: nhỏ hơn 8px thì ở cạnh dài 1536px mắt người cũng không nhận ra đó là
  # căn nhà nào, giữ lại chỉ thêm rác cho cả lúc train lẫn lúc đếm.
  min_side_px: 8

  # Nếu percentile 5 của cạnh box nhỏ nhất SAU RESIZE (đã lọc nhiễu) >= mốc này
  # (px) => KHÔNG cần cắt tile.
  min_box_side_p5_ok: 32

  # Component có diện tích > hệ số này x trung vị ĐÃ LỌC NHIỄU => nghi nhiều nhà bị
  # gộp làm một. Mốc phải tính trên trung vị đã lọc: lấy trung vị thô thì đốm nhiễu
  # kéo mốc xuống 40% và mọi nhà to thật đều bị gắn cờ (gặp thật 30/09/2026).
  area_outlier_ratio: 3.0

  # ---------------------------------------------------------------------------
  # CHỐT CỦA GATE 1 — 30/09/2026, trên số liệu chạy đầy đủ 2343 ảnh (NOTES §2.4).
  # Đây là thứ đồ án LÀM; các ngưỡng ở trên chỉ là máy tự tính. Chỗ nào hai bên
  # khác nhau thì báo cáo EDA in rõ lý do, để người đọc không thấy mâu thuẫn.
  # ---------------------------------------------------------------------------

  # Ngưỡng tự động nói "CÓ" (p5 = 28,0px < 32px) — đồ án chốt KHÔNG, vì:
  #   1. Sát ngưỡng đúng 4px, và TOÀN BỘ phần thiếu đến từ non_flooded_building
  #      (flooded_building một mình là 44,0px, vượt thoải mái). Tức quyết định độ
  #      phân giải của cả đồ án đang do một lớp quyết định.
  #   2. 28px = 3,5 ô ở tầng stride-8 của FPN — vẫn nằm trong vùng phát hiện được,
  #      không phải vùng chết. Vùng chết là dưới ~16px (2 ô).
  #   3. Cắt tile 2x2 làm dataset và thời gian train tăng 4 lần trên T4, cộng thêm
  #      code ghép box khi suy luận — đắt so với 5% số box bị ảnh hưởng. Dữ liệu
  #      lại vốn đã thưa (chỉ 10,5% ảnh có nhà ngập), cắt tile làm tỉ lệ đó thưa thêm.
  #   4. Quyết định này chốt TRƯỚC khi train, không phải sau khi xem mAP — giữ đúng
  #      tinh thần "không chỉnh tham số sau khi thấy kết quả" của plan.
  # Đổi lại: Phase 6 phải có một thí nghiệm so tiled/không-tiled trên val. Nếu phân
  # tích lỗi cho thấy nhà nhỏ là nguồn lỗi chính thì đó là căn cứ để bật lại.
  cat_tile: false

  # Ngưỡng tự động nói "CÓ" (11,9% box > 3x trung vị) — đồ án chốt KHÔNG, vì:
  #   1. Người dùng đã xem 30 ảnh overlay: các box viền TÍM đều là MỘT căn nhà to,
  #      không phải nhiều căn dính nhau. Đây là bằng chứng trực tiếp, mạnh hơn chỉ số.
  #   2. Chỉ số lệch giữa hai lớp tới 75 lần (0,3% so với 23,0%). Nhà kề nhà thì kề
  #      như nhau, ngập hay không ngập không ảnh hưởng — nên chênh lệch cỡ đó nghĩa
  #      là chỉ số đang đo PHÂN BỐ KÍCH THƯỚC nhà (nhà ống vs nhà xưởng), không đo
  #      chuyện gộp nhà.
  # Thêm cả bước watershed là thêm một nguồn sai số vào pipeline mà không có căn cứ.
  tach_nha_dinh: false

# ---------------------------------------------------------------------------
# Khảo sát
# ---------------------------------------------------------------------------
eda:
  num_overlays: 30
  seed: 42
  # Chỉ xử lý N ảnh đầu mỗi split — dùng để chạy thử cho nhanh. null = chạy hết.
  max_images: null
  # Số ảnh lấy mẫu để kiểm chứng "nhà ngập nằm cạnh nước" (tốn thời gian hơn).
  num_water_check: 60
